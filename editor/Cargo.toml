[package]
name = "sky_plugin"
version = "0.1.0"
edition = "2024"
description = "Sky (pulsar.sky): the editor plugin -- its metadata, over the plugin's component crate"

[lib]
name = "sky_plugin"

[features]
# Statically linked hosts (the editor) use the Rust API; the component crate
# (with everything it registers) comes with this crate.
builtin = []

[dependencies]
sky_component = { workspace = true }
plugin_editor_api = { workspace = true }
# The level editor UI: registrations through its extension points
# (`ui_level_editor::extend`), each naming its origin.
ui_level_editor = { workspace = true }
inventory = { workspace = true }
pulsar_plugins = { workspace = true }
rust-i18n = { workspace = true }
# Adding the CC0 Deep-Space panoramas to a project (`panoramas`): downloaded
# at editor time, verified, written into the project. Never in a game build.
engine_fs = { workspace = true }
engine_state = { workspace = true }
tracing = { workspace = true }
image = { workspace = true, features = ["hdr"] }
sha2 = "0.10"
ureq = "2.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
