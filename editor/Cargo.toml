[package]
name = "sky_editor"
version = "0.1.0"
edition = "2024"
description = "Sky (pulsar.sky): the editor crate -- the level editor's sky entry and World Settings section, over the plugin's component crate"

[lib]
name = "sky_editor"

[dependencies]
sky_component = { workspace = true }
# The level editor UI the root registers through its extension points
# (`ui_level_editor::extend`).
ui_level_editor = { workspace = true }
rust-i18n = { workspace = true }
# Adding the CC0 Deep-Space panoramas to a project (`panoramas`): downloaded
# at editor time, verified, written into the project. Never in a game build.
engine_fs = { workspace = true }
engine_state = { workspace = true }
tracing = { workspace = true }
image = { workspace = true, features = ["hdr"] }
sha2 = "0.10"
ureq = "2.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
