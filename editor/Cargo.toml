[package]
name = "sky_editor"
version = "0.1.0"
edition = "2024"
description = "Sky (pulsar.sky): the editor crate -- the level editor's sky entry and World Settings section, over the plugin's component crate"

[lib]
name = "sky_editor"

[dependencies]
sky_component = { workspace = true }
# The level editor UI the root registers through its extension points
# (`ui_level_editor::extend`).
ui_level_editor = { workspace = true }
rust-i18n = { workspace = true }
# Adding the CC0 Deep-Space panoramas to a project (`panoramas`): the shell
# downloads and verifies the archive (`ui_level_editor::extend::StarterContent`),
# this crate extracts it and writes the files. Never in a game build.
engine_fs = { workspace = true }
image = { workspace = true, features = ["hdr"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
