# The `pulsar.sky` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.sky"
name = "Sky"
description = "The level's sky: the atmosphere component (air, sun disc, clouds and weather), its row and the renderer feature that draws it and publishes the sky's lighting inputs"
enabled_by_default = true
provides = [
  { id = "pulsar.sky.rows", kind = "buffer", members = ["atmospheres"] },
]
# Optional: the atmosphere runs without lights on the frame's stand-in.
requires = [
  { id = "pulsar.lights.rows", optional = true },
  { id = "pulsar.lights.api", optional = true },
]

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "sky_plugin"
