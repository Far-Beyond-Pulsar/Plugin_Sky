[package]
name = "sky_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Sky (`pulsar.sky`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# The editor's registrations (the Create menu's sky, the World Settings
# section) and the crates they need. A game links the root without it, so it
# takes no editor dependency.
editor = ["dep:sky_editor", "dep:ui_level_editor"]

[dependencies]
# The plugin gate and the builder its registrations go through.
pulsar_plugins = { workspace = true }
# The plugin's crates.
sky_component = { workspace = true }
sky_editor = { workspace = true, optional = true }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
pulsar_world_registry = { workspace = true }
# The editor's extension points.
ui_level_editor = { workspace = true, optional = true }

[dev-dependencies]
# The plugin's integration tests (`tests/`): the plugin as a game links it.
pollster = "=0.4.0"
glam = { workspace = true }
helio = { workspace = true }
helio-core = { workspace = true }
helio-pass-sky = { workspace = true }
helio-scene-join = { workspace = true }
pulsar_scenedb = { workspace = true }
serde_json = { workspace = true }
pulsar_reflection = { workspace = true }
bytemuck = { workspace = true }
wgpu = { workspace = true }
# `tests/starter_content.rs` (with the `editor` feature): the panorama installer
# against a temporary project and a local server.
engine_fs = { workspace = true }
engine_state = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
image = { workspace = true, features = ["hdr"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
